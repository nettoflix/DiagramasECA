<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluxograma ECA</title>
<meta name="author" content="Nettoflix">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<style>
:root {
  --chao: #e9edf1;
  --superficie: #ffffff;
  --tinta: #15202b;
  --suave: #5a6774;
  --borda: #cbd3db;
  --linha: #a2adb9;
  --feita: #1b8656;
  --feita-borda: #146b44;
  --sobre-feita: #ffffff;
  --aberta: #2a60d0;
  --aberta-fundo: #ffffff;
  --bloq-fundo: #dde2e8;
  --bloq-borda: #bcc5cf;
  --bloq-texto: #6a7682;
  --destaque: #e0900e;
  --foco: #2a60d0;
  --barra: #f7f9fa;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chao: #0f151b;
    --superficie: #18212a;
    --tinta: #e4e9ee;
    --suave: #93a0ad;
    --borda: #2b3642;
    --linha: #4b5764;
    --feita: #2fa56e;
    --feita-borda: #3cc184;
    --sobre-feita: #06140d;
    --aberta: #6f9bf2;
    --aberta-fundo: #18212a;
    --bloq-fundo: #212a34;
    --bloq-borda: #2f3a46;
    --bloq-texto: #7d8995;
    --destaque: #f1b43c;
    --foco: #6f9bf2;
    --barra: #141b22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chao: #0f151b;
  --superficie: #18212a;
  --tinta: #e4e9ee;
  --suave: #93a0ad;
  --borda: #2b3642;
  --linha: #4b5764;
  --feita: #2fa56e;
  --feita-borda: #3cc184;
  --sobre-feita: #06140d;
  --aberta: #6f9bf2;
  --aberta-fundo: #18212a;
  --bloq-fundo: #212a34;
  --bloq-borda: #2f3a46;
  --bloq-texto: #7d8995;
  --destaque: #f1b43c;
  --foco: #6f9bf2;
  --barra: #141b22;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--chao);
  color: var(--tinta);
  font: 500 14px/1.4 "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topo {
  background: var(--barra);
  border-bottom: 1px solid var(--borda);
  padding-block: 10px 8px;
  padding-inline: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.linha-topo {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 20px;
}
h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
h1 small {
  font-weight: 500;
  font-size: 14px;
  color: var(--suave);
  margin-left: 6px;
}
.progresso {
  display: flex;
  align-items: center;
  gap: 10px;
  font-variant-numeric: tabular-nums;
}
.progresso strong { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; }
.trilho {
  width: 120px;
  height: 6px;
  background: var(--bloq-fundo);
  border-radius: 3px;
  overflow: hidden;
}
.trilho span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--feita);
  transition: width 200ms ease-out;
}
.legenda {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  color: var(--suave);
  margin-left: auto;
}
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i {
  width: 14px;
  height: 10px;
  border-radius: 2px;
  display: inline-block;
}
.legenda .l-feita i { background: var(--feita); border: 1.5px solid var(--feita-borda); }
.legenda .l-aberta i { background: var(--aberta-fundo); border: 2px solid var(--aberta); }
.legenda .l-bloq i { background: var(--bloq-fundo); border: 1.5px solid var(--bloq-borda); }

.credito {
  margin: 0;
  font-size: 13px;
  color: var(--suave);
}
.credito a {
  color: var(--tinta);
  font-weight: 700;
  text-decoration: none;
  border-bottom: 1.5px solid var(--feita);
}
.credito a:hover { color: var(--feita); }
.credito a:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
.ferramentas {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.fases {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  min-width: 0;
  scrollbar-width: thin;
}
button {
  font: inherit;
  color: var(--tinta);
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: 6px;
  padding: 4px 10px;
  min-height: 30px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover { border-color: var(--suave); }
button:focus-visible { outline: 2px solid var(--foco); outline-offset: 1px; }
button.ativa { border-color: var(--aberta); color: var(--aberta); }
.zoom-num {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12px;
  color: var(--suave);
  min-width: 42px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.sep { width: 1px; align-self: stretch; background: var(--borda); margin-inline: 4px; }
#limpar { color: var(--suave); }
#limpar.confirmar { color: #fff; background: #b8322a; border-color: #b8322a; }

.palco { position: relative; flex: 1; min-height: 0; }
#mapa {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}
#mapa.arrastando { cursor: grabbing; }

.cabecalho {
  font: 600 30px "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  fill: var(--suave);
  letter-spacing: 0.02em;
}
.lig {
  fill: none;
  stroke: var(--linha);
  stroke-width: 4;
  stroke-linecap: square;
  stroke-linejoin: miter;
  transition: opacity 120ms, stroke 150ms;
}
.lig.feita { stroke: var(--feita); }
#mapa.focando .lig { opacity: 0.18; }
#mapa.focando .lig.rel { opacity: 1; stroke: var(--destaque); stroke-width: 6; }

.disc { cursor: pointer; outline: none; }
.disc rect.caixa { stroke-width: 3; transition: fill 150ms, stroke 150ms; }
.disc text { pointer-events: none; }
.disc .nome { font: 600 16px "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; }
.disc .cod { font: 500 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.02em; }
.disc .req { font-size: 10.5px; }
.disc.bloq rect.caixa { fill: var(--bloq-fundo); stroke: var(--bloq-borda); }
.disc.bloq text { fill: var(--bloq-texto); }
.disc.aberta rect.caixa { fill: var(--aberta-fundo); stroke: var(--aberta); }
.disc.aberta .nome { fill: var(--tinta); }
.disc.aberta .cod { fill: var(--aberta); }
.disc.feita rect.caixa { fill: var(--feita); stroke: var(--feita-borda); }
.disc.feita text { fill: var(--sobre-feita); }
.disc rect.anel { fill: none; stroke: var(--foco); stroke-width: 3; opacity: 0; }
.disc:focus-visible rect.anel { opacity: 1; }
#mapa.focando .disc.rel rect.caixa { stroke: var(--destaque); }
.disc.tremer { animation: tremer 320ms ease-in-out; }
@keyframes tremer {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.aviso {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
  pointer-events: none;
}
.msg {
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: 8px;
  padding: 8px 12px;
  max-width: 60ch;
  box-shadow: 0 4px 16px rgb(0 0 0 / 0.12);
  opacity: 0;
  transition: opacity 180ms;
}
.msg.visivel { opacity: 1; }
.dica { color: var(--suave); font-size: 12px; margin-left: auto; text-align: right; line-height: 1.25; }
@media (max-width: 1100px) { .dica { display: none; } #limpar { margin-left: auto; } }

@media (max-width: 640px) {
  .ferramentas { flex-wrap: wrap; }
  .ferramentas .sep { display: none; }
  .fases { order: 5; flex-basis: 100%; padding-bottom: 2px; }
  .legenda { margin-left: 0; }
  .dica { display: none; }
  h1 small { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .lig, .disc rect.caixa, .trilho span, .msg { transition: none; }
  .disc.tremer { animation: none; }
}
</style>
</head>
<body>
<header class="topo">
  <div class="linha-topo">
    <h1>Fluxograma ECA <small>Engenharia de Controle e Automação</small></h1>
    <div class="progresso" aria-live="polite">
      <div class="trilho" aria-hidden="true"><span id="barra"></span></div>
      <span><strong id="feitas">0</strong> de <strong id="total">0</strong> concluídas · <strong id="abertas">0</strong> disponíveis · <strong id="horas">0</strong> de <strong id="horas-total">0</strong> h/a obrigatórias</span>
    </div>
    <div class="legenda">
      <span class="l-feita"><i></i>Concluída</span>
      <span class="l-aberta"><i></i>Disponível</span>
      <span class="l-bloq"><i></i>Bloqueada</span>
    </div>
    <p class="credito">feito por <a href="https://github.com/nettoflix" target="_blank" rel="noopener">Nettoflix</a></p>
  </div>
  <div class="ferramentas">
    <button id="tudo" type="button" title="Mostrar todas as fases (0)">Ver tudo</button>
    <button id="menos" type="button" aria-label="Diminuir zoom" title="Diminuir zoom (−)">−</button>
    <span class="zoom-num" id="zoom">100%</span>
    <button id="mais" type="button" aria-label="Aumentar zoom" title="Aumentar zoom (+)">+</button>
    <span class="sep" aria-hidden="true"></span>
    <div class="fases" id="fases" role="group" aria-label="Focar numa fase"></div>
    <span class="dica">Clique numa disciplina para marcar · arraste para mover · roda ou pinça para zoom · Shift+clique nas fases: intervalo</span>
    <button id="limpar" type="button">Limpar progresso</button>
  </div>
</header>

<main class="palco">
  <svg id="mapa" role="application" aria-label="Mapa de disciplinas e pré-requisitos">
    <g id="g-cab"></g>
    <g id="g-lig"></g>
    <g id="g-disc"></g>
  </svg>
  <div class="aviso">
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </div>
</main>

<script>
(() => {
  const SVGNS = 'http://www.w3.org/2000/svg';
  const CHAVE = 'fluxograma-eca:concluidas:v1';
  const [BW, BH] = DADOS.caixa;
  const mapa = document.getElementById('mapa');
  const gCab = document.getElementById('g-cab');
  const gLig = document.getElementById('g-lig');
  const gDisc = document.getElementById('g-disc');
  const porId = new Map(DADOS.disciplinas.map(d => [d.id, d]));
  const dependentes = new Map(DADOS.disciplinas.map(d => [d.id, []]));
  DADOS.disciplinas.forEach(d => d.pre.forEach(p => dependentes.get(p).push(d.id)));

  // ---------- estado ----------
  // códigos que mudaram no currículo 20241 (progresso salvo antes da mudança)
  const MIGRAR = { DAS_5411: 'DAS_5412', DAS_5114: 'DAS_5214', DAS_5312: 'DAS_5320', DAS_5104: 'DAS_5105',
                   DAS_5310: 'DAS_5318', DAS_5401: 'DAS_5402', EPS_5211: 'EPS_7076', DAS_5501: 'DAS_5502',
                   DAS_5511: 'DAS_5512' };
  let feitas = new Set();
  try {
    const salvo = JSON.parse(localStorage.getItem(CHAVE) || '[]');
    salvo.map(id => MIGRAR[id] || id).forEach(id => porId.has(id) && feitas.add(id));
  } catch (e) { /* armazenamento indisponível: começa vazio */ }
  const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify([...feitas])); } catch (e) {} };
  // horas-aula obrigatórias concluídas ("Pré CH" do currículo conta só obrigatórias)
  const horasOb = () => DADOS.disciplinas.reduce((t, d) => t + (d.ob && feitas.has(d.id) ? d.ha : 0), 0);
  const TOTAL_OB = DADOS.disciplinas.reduce((t, d) => t + (d.ob ? d.ha : 0), 0);
  // quanto falta para a exigência de carga horária (sem contar a própria disciplina)
  const faltamHoras = d => d.preCH ? Math.max(0, d.preCH - (horasOb() - (d.ob && feitas.has(d.id) ? d.ha : 0))) : 0;
  const aberta = d => d.pre.every(p => feitas.has(p)) && faltamHoras(d) === 0;
  const fmt = n => n.toLocaleString('pt-BR');

  // ---------- geometria da cena ----------
  const colX = new Map();
  DADOS.disciplinas.forEach(d => colX.set(d.fase, d.x));
  const nFases = Math.max(...colX.keys());
  const topoConteudo = 128;
  const limites = {
    x0: Math.min(...DADOS.disciplinas.map(d => d.x)),
    x1: Math.max(...DADOS.disciplinas.map(d => d.x + BW)),
    y0: topoConteudo,
    y1: Math.max(...DADOS.disciplinas.map(d => d.y + BH)),
  };

  // ---------- desenho ----------
  const el = (tag, attrs, pai) => {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (pai) pai.appendChild(n);
    return n;
  };

  for (let f = 1; f <= nFases; f++) {
    const t = el('text', { x: colX.get(f) + BW / 2, y: 196, 'text-anchor': 'middle', class: 'cabecalho' }, gCab);
    t.textContent = f + 'ª fase';
  }

  const ligs = DADOS.linhas.map(l => {
    const p = el('polyline', { points: l.pts.map(q => q.join(',')).join(' '), class: 'lig' }, gLig);
    p.dataset.de = l.de;
    p.dataset.para = l.para;
    return p;
  });

  const medidor = document.createElement('canvas').getContext('2d');
  function quebrar(texto, fonte, largura) {
    medidor.font = fonte;
    const linhas = [];
    let atual = '';
    for (const palavra of texto.split(/\s+/)) {
      const teste = atual ? atual + ' ' + palavra : palavra;
      if (medidor.measureText(teste).width <= largura || !atual) atual = teste;
      else { linhas.push(atual); atual = palavra; }
    }
    if (atual) linhas.push(atual);
    return linhas;
  }

  const grupos = new Map();
  function desenharCaixas() {
    gDisc.textContent = '';
    for (const d of DADOS.disciplinas) {
      const g = el('g', { class: 'disc', tabindex: '0', role: 'button' }, gDisc);
      g.dataset.id = d.id;
      g.style.transformOrigin = `${d.x + BW / 2}px ${d.y + BH / 2}px`;
      el('rect', { class: 'caixa', x: d.x + 1.5, y: d.y + 1.5, width: BW - 3, height: BH - 3, rx: 3 }, g);
      el('rect', { class: 'anel', x: d.x - 4, y: d.y - 4, width: BW + 8, height: BH + 8, rx: 6 }, g);
      const topoNome = d.y + 26;
      const c = el('text', { class: 'cod', x: d.x + BW / 2, y: d.y + 19, 'text-anchor': 'middle' }, g);
      c.textContent = (d.codigo ? d.codigo + ' · ' : '') + d.ha + ' h/a' + (d.ob ? '' : ' · optativa');
      const baseNome = d.preCH ? d.y + BH - 22 : d.y + BH - 8;
      if (d.preCH) {
        const r = el('text', { class: 'cod req', x: d.x + BW / 2, y: d.y + BH - 10, 'text-anchor': 'middle' }, g);
        r.textContent = 'requer ' + fmt(d.preCH) + ' h/a';
      }
      let tam = 16, linhas;
      do {
        linhas = quebrar(d.nome, `600 ${tam}px "IBM Plex Sans Condensed", "Arial Narrow", sans-serif`, BW - 18);
        if (linhas.length <= (d.preCH ? 3 : 4)) break;
        tam -= 1;
      } while (tam > 12);
      const alt = tam * 1.15;
      const espaco = baseNome - topoNome;
      const y0 = topoNome + (espaco - alt * linhas.length) / 2 + tam * 0.85;
      const t = el('text', { class: 'nome', x: d.x + BW / 2, 'text-anchor': 'middle', 'font-size': tam }, g);
      linhas.forEach((ln, i) => {
        const s = el('tspan', { x: d.x + BW / 2, y: (y0 + i * alt).toFixed(1) }, t);
        s.textContent = ln;
      });
      el('title', {}, g).textContent = d.nome + (d.codigo ? ` (${d.codigo})` : '') + ` · ${d.ha} horas-aula`
        + (d.ob ? '' : ' (optativa)') + (d.preCH ? ` · exige ${fmt(d.preCH)} h/a obrigatórias concluídas` : '');
      grupos.set(d.id, g);
    }
  }

  // ---------- estado visual ----------
  const elFeitas = document.getElementById('feitas');
  const elAbertas = document.getElementById('abertas');
  const elBarra = document.getElementById('barra');
  document.getElementById('total').textContent = DADOS.disciplinas.length;
  document.getElementById('horas-total').textContent = fmt(TOTAL_OB);
  const elHoras = document.getElementById('horas');

  function atualizar() {
    let nAbertas = 0;
    for (const d of DADOS.disciplinas) {
      const g = grupos.get(d.id);
      const feita = feitas.has(d.id);
      const ab = !feita && aberta(d);
      if (ab) nAbertas++;
      g.classList.toggle('feita', feita);
      g.classList.toggle('aberta', ab);
      g.classList.toggle('bloq', !feita && !ab);
      g.setAttribute('aria-pressed', feita);
      g.setAttribute('aria-label', `${d.nome}, ${d.fase}ª fase, ${feita ? 'concluída' : ab ? 'disponível' : 'bloqueada'}`);
    }
    ligs.forEach(p => p.classList.toggle('feita', feitas.has(p.dataset.de)));
    elFeitas.textContent = feitas.size;
    elAbertas.textContent = nAbertas;
    elBarra.style.width = (100 * horasOb() / TOTAL_OB) + '%';
    elHoras.textContent = fmt(horasOb());
  }

  const elMsg = document.getElementById('msg');
  let tMsg;
  function mensagem(texto) {
    elMsg.textContent = texto;
    elMsg.classList.add('visivel');
    clearTimeout(tMsg);
    tMsg = setTimeout(() => elMsg.classList.remove('visivel'), 4200);
  }
  const listar = nomes => nomes.length === 1 ? nomes[0]
    : nomes.slice(0, -1).join(', ') + ' e ' + nomes[nomes.length - 1];

  function alternar(id) {
    const d = porId.get(id);
    if (feitas.has(id)) {
      feitas.delete(id);
      // desmarca em cascata quem dependia desta disciplina
      const removidas = [];
      let mudou = true;
      while (mudou) {
        mudou = false;
        for (const x of [...feitas]) {
          if (!aberta(porId.get(x))) { feitas.delete(x); removidas.push(porId.get(x).nome); mudou = true; }
        }
      }
      if (removidas.length) mensagem(`Também desmarcadas (pré-requisito ou carga horária): ${listar(removidas)}.`);
    } else if (aberta(d)) {
      feitas.add(id);
    } else {
      const faltam = d.pre.filter(p => !feitas.has(p)).map(p => porId.get(p).nome);
      const partes = [];
      if (faltam.length) partes.push(`conclua antes ${listar(faltam)}`);
      const fh = faltamHoras(d);
      if (fh) partes.push(`faltam ${fmt(fh)} h/a obrigatórias (exige ${fmt(d.preCH)}, você tem ${fmt(horasOb())})`);
      mensagem(`${d.nome} está bloqueada: ${partes.join('; ')}.`);
      const g = grupos.get(id);
      g.classList.remove('tremer');
      void g.getBoundingClientRect();
      g.classList.add('tremer');
      return;
    }
    salvar();
    atualizar();
  }

  // destaque de pré-requisitos e dependentes (mouse e teclado)
  function focar(id) {
    if (!id) {
      mapa.classList.remove('focando');
      document.querySelectorAll('.rel').forEach(n => n.classList.remove('rel'));
      return;
    }
    mapa.classList.add('focando');
    ligs.forEach(p => p.classList.toggle('rel', p.dataset.de === id || p.dataset.para === id));
    const vizinhos = new Set([...porId.get(id).pre, ...dependentes.get(id)]);
    grupos.forEach((g, gid) => g.classList.toggle('rel', vizinhos.has(gid)));
    // linhas destacadas por cima das demais
    ligs.filter(p => p.classList.contains('rel')).forEach(p => gLig.appendChild(p));
  }

  // ---------- câmera (viewBox) ----------
  const cam = { cx: 0, cy: 0, s: 1 };
  let autoAjuste = true;
  let anim = null;
  const tamanho = () => ({ W: mapa.clientWidth || 1, H: mapa.clientHeight || 1 });
  const MARGEM = 24, S_MAX = 3, S_FOCO = 1.5;
  function escalaTudo() {
    const { W, H } = tamanho();
    return Math.min(W / (limites.x1 - limites.x0 + 2 * MARGEM), H / (limites.y1 - limites.y0 + 2 * MARGEM));
  }
  const sMin = () => escalaTudo() * 0.85;
  const elZoom = document.getElementById('zoom');
  function aplicar() {
    const { W, H } = tamanho();
    const w = W / cam.s, h = H / cam.s;
    mapa.setAttribute('viewBox', `${cam.cx - w / 2} ${cam.cy - h / 2} ${w} ${h}`);
    elZoom.textContent = Math.round(cam.s * 100) + '%';
  }
  const reduzirMovimento = matchMedia('(prefers-reduced-motion: reduce)');
  function irPara(s, cx, cy, animar = true) {
    s = Math.min(S_MAX, Math.max(sMin(), s));
    cancelAnimationFrame(anim);
    if (!animar || reduzirMovimento.matches) {
      Object.assign(cam, { s, cx, cy });
      aplicar();
      return;
    }
    const de = { ...cam }, t0 = performance.now(), dur = 260;
    const passo = agora => {
      const t = Math.min(1, (agora - t0) / dur);
      const e = 1 - Math.pow(1 - t, 3);
      cam.s = de.s * Math.pow(s / de.s, e);
      cam.cx = de.cx + (cx - de.cx) * e;
      cam.cy = de.cy + (cy - de.cy) * e;
      aplicar();
      if (t < 1) anim = requestAnimationFrame(passo);
    };
    anim = requestAnimationFrame(passo);
  }
  function verTudo(animar = true) {
    autoAjuste = true;
    faseAtiva(null);
    irPara(escalaTudo(), (limites.x0 + limites.x1) / 2, (limites.y0 + limites.y1) / 2, animar);
  }
  function focarFases(a, b) {
    autoAjuste = false;
    const { W, H } = tamanho();
    const x0 = colX.get(a) - 60, x1 = colX.get(b) + BW + 60;
    const s = Math.max(escalaTudo(), Math.min(W / (x1 - x0), S_FOCO));
    // topo da vista no topo das fases (títulos visíveis); o resto se vê rolando
    irPara(s, (x0 + x1) / 2, limites.y0 - MARGEM + H / s / 2);
  }
  const paraCena = (px, py) => {
    const r = mapa.getBoundingClientRect(), { W, H } = tamanho();
    return { x: cam.cx + (px - r.left - W / 2) / cam.s, y: cam.cy + (py - r.top - H / 2) / cam.s };
  };
  function zoomEm(px, py, fator) {
    autoAjuste = false;
    cancelAnimationFrame(anim);
    const antes = paraCena(px, py);
    cam.s = Math.min(S_MAX, Math.max(sMin(), cam.s * fator));
    const depois = paraCena(px, py);
    cam.cx += antes.x - depois.x;
    cam.cy += antes.y - depois.y;
    aplicar();
  }
  function zoomCentro(fator) {
    const r = mapa.getBoundingClientRect();
    zoomEm(r.left + r.width / 2, r.top + r.height / 2, fator);
  }

  // ---------- barra de ferramentas ----------
  const elFases = document.getElementById('fases');
  const botoesFase = [];
  let ultimaFase = null;
  function faseAtiva(a, b = a) {
    botoesFase.forEach((bt, i) => bt.classList.toggle('ativa', a !== null && i + 1 >= a && i + 1 <= b));
  }
  for (let f = 1; f <= nFases; f++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = f + 'ª';
    b.title = `Focar na ${f}ª fase (Shift+clique: intervalo de fases)`;
    b.addEventListener('click', ev => {
      if (ev.shiftKey && ultimaFase !== null) {
        const a = Math.min(ultimaFase, f), z = Math.max(ultimaFase, f);
        faseAtiva(a, z);
        focarFases(a, z);
      } else {
        ultimaFase = f;
        faseAtiva(f);
        focarFases(f, f);
      }
    });
    elFases.appendChild(b);
    botoesFase.push(b);
  }
  document.getElementById('tudo').addEventListener('click', () => verTudo());
  document.getElementById('mais').addEventListener('click', () => zoomCentro(1.25));
  document.getElementById('menos').addEventListener('click', () => zoomCentro(1 / 1.25));
  const btLimpar = document.getElementById('limpar');
  let tLimpar;
  btLimpar.addEventListener('click', () => {
    if (!btLimpar.classList.contains('confirmar')) {
      btLimpar.classList.add('confirmar');
      btLimpar.textContent = 'Confirmar: apagar tudo';
      tLimpar = setTimeout(() => { btLimpar.classList.remove('confirmar'); btLimpar.textContent = 'Limpar progresso'; }, 4000);
      return;
    }
    clearTimeout(tLimpar);
    btLimpar.classList.remove('confirmar');
    btLimpar.textContent = 'Limpar progresso';
    feitas.clear();
    salvar();
    atualizar();
    mensagem('Progresso apagado.');
  });

  // ---------- ponteiro: clique, arrasto e pinça ----------
  const ponteiros = new Map();
  let arrasto = null;
  mapa.addEventListener('pointerdown', ev => {
    ponteiros.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    const alvo = ev.target.closest('.disc');
    if (ponteiros.size === 1) {
      arrasto = { x: ev.clientX, y: ev.clientY, cx: cam.cx, cy: cam.cy, moveu: false, alvo: alvo && alvo.dataset.id };
    } else if (ponteiros.size === 2) {
      const [p, q] = [...ponteiros.values()];
      arrasto = { pinca: true, d0: Math.hypot(p.x - q.x, p.y - q.y), s0: cam.s, moveu: true };
    }
    mapa.setPointerCapture(ev.pointerId);
  });
  mapa.addEventListener('pointermove', ev => {
    if (!ponteiros.has(ev.pointerId) || !arrasto) return;
    ponteiros.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (arrasto.pinca && ponteiros.size === 2) {
      const [p, q] = [...ponteiros.values()];
      const d = Math.hypot(p.x - q.x, p.y - q.y);
      zoomEm((p.x + q.x) / 2, (p.y + q.y) / 2, (arrasto.s0 * d / arrasto.d0) / cam.s);
      return;
    }
    const dx = ev.clientX - arrasto.x, dy = ev.clientY - arrasto.y;
    if (!arrasto.moveu && Math.hypot(dx, dy) > 5) {
      arrasto.moveu = true;
      autoAjuste = false;
      cancelAnimationFrame(anim);
      mapa.classList.add('arrastando');
    }
    if (arrasto.moveu) {
      cam.cx = arrasto.cx - dx / cam.s;
      cam.cy = arrasto.cy - dy / cam.s;
      aplicar();
    }
  });
  const soltar = ev => {
    if (!ponteiros.has(ev.pointerId)) return;
    ponteiros.delete(ev.pointerId);
    if (ev.type === 'pointerup' && arrasto && !arrasto.moveu && arrasto.alvo) alternar(arrasto.alvo);
    if (ponteiros.size === 0) { arrasto = null; mapa.classList.remove('arrastando'); }
    else if (arrasto && arrasto.pinca) {
      const [p] = [...ponteiros.values()];
      arrasto = { x: p.x, y: p.y, cx: cam.cx, cy: cam.cy, moveu: true };
    }
  };
  mapa.addEventListener('pointerup', soltar);
  mapa.addEventListener('pointercancel', soltar);
  mapa.addEventListener('wheel', ev => {
    ev.preventDefault();
    const unidade = ev.deltaMode === 1 ? 33 : ev.deltaMode === 2 ? 400 : 1;
    zoomEm(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * unidade * 0.0015));
  }, { passive: false });

  // destaque ao passar o mouse
  mapa.addEventListener('pointerover', ev => {
    if (ev.pointerType !== 'mouse' || arrasto) return;
    const g = ev.target.closest('.disc');
    focar(g ? g.dataset.id : null);
  });
  mapa.addEventListener('pointerleave', () => focar(null));

  // teclado
  gDisc.addEventListener('keydown', ev => {
    const g = ev.target.closest('.disc');
    if (g && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); alternar(g.dataset.id); }
  });
  gDisc.addEventListener('focusin', ev => { const g = ev.target.closest('.disc'); if (g) focar(g.dataset.id); });
  gDisc.addEventListener('focusout', () => focar(null));
  document.addEventListener('keydown', ev => {
    if (ev.target.closest && ev.target.closest('input, textarea')) return;
    if (ev.key === '0') verTudo();
    else if (ev.key === '+' || ev.key === '=') zoomCentro(1.25);
    else if (ev.key === '-') zoomCentro(1 / 1.25);
  });

  new ResizeObserver(() => {
    if (autoAjuste) verTudo(false);
    else { cam.s = Math.max(cam.s, sMin()); aplicar(); }
  }).observe(mapa);

  // ---------- início ----------
  const fontes = document.fonts
    ? Promise.race([
        Promise.all([
          document.fonts.load('600 16px "IBM Plex Sans Condensed"'),
          document.fonts.load('500 11px "IBM Plex Mono"'),
        ]),
        new Promise(r => setTimeout(r, 2500)),
      ]).catch(() => {})
    : Promise.resolve();
  desenharCaixas(); atualizar(); verTudo(false);   // desenha já, com a fonte de reserva
  fontes.then(() => { desenharCaixas(); atualizar(); });  // e refaz a quebra de linha com a fonte certa
})();
</script>
</body>
</html>
