name: Conferir currículos

on:
  push:
    paths: ['files/curriculos/**', 'files/disciplinas.txt', 'web/curriculo.js', '.github/verificar_curriculos.js']
  pull_request:
    paths: ['files/curriculos/**', 'files/disciplinas.txt', 'web/curriculo.js', '.github/verificar_curriculos.js']
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/verificar_curriculos.js
